<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación</title>
    <style>
    
#contador{
    position:absolute;
    left:50%;
    bottom:10%;
    transform:translateX(-50%) scale(0.45);
    transform-origin:center;
    display:flex;
    gap:15px;
    z-index:100;
}

.tiempo{
    text-align:center;
    min-width:55px;
}

.numero{
    font-size:5rem;
    font-weight:bold;
    color:#fff;

    text-shadow:
        0 0 6px rgba(255,255,255,.8),
        0 0 12px rgba(255,255,255,.7);
}

.texto{
    margin-top:2px;
    font-size:1.5rem;
    color:#fff;
    text-transform:uppercase;
    letter-spacing:1px;
}

        #pantalla-bienvenida {
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: #f6eae6;
            overflow: hidden;
            cursor: pointer;
        }

        /* SVG sobre - Colores rosa */
        #sobre-svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        /* Brillitos ENCIMA de las solapas */
        #glitter-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 15;
            pointer-events: none;
        }

        .solapa { transition: transform 1.3s cubic-bezier(0.77, 0, 0.18, 1); }
        .solapa-izq    { transform-box: fill-box; transform-origin: 0% 50%; }
        .solapa-der    { transform-box: fill-box; transform-origin: 100% 50%; }
        .solapa-top    { transform-box: fill-box; transform-origin: 50% 0%; }
        .solapa-bottom { transform-box: fill-box; transform-origin: 50% 100%; }

        #pantalla-bienvenida.abriendo .solapa-izq    { transform: translateX(-120%); }
        #pantalla-bienvenida.abriendo .solapa-der    { transform: translateX(120%); }
        #pantalla-bienvenida.abriendo .solapa-top    { transform: translateY(-120%); }
        #pantalla-bienvenida.abriendo .solapa-bottom { transform: translateY(120%); }

        #pantalla-bienvenida.oculto { display: none; }

        /* Sello */
        #sello-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(55vw, 260px);
            height: min(55vw, 260px);
            z-index: 20;
            cursor: pointer;
            pointer-events: all;
            transition: transform 0.6s ease, opacity 0.6s ease;
            animation: sello-breathe 3s ease-in-out infinite;
        }
        @keyframes sello-breathe {
            0%,100% { transform: translate(-50%,-50%) scale(1);    filter: drop-shadow(0 0 18px rgba(244, 195, 195, 0.7)); }
            50%     { transform: translate(-50%,-50%) scale(1.05); filter: drop-shadow(0 0 38px rgba(244, 195, 195, 0.95)); }
        }
        #sello-btn img {
            width: 100%; height: 100%; object-fit: contain; display: block;
        }
        #pantalla-bienvenida.abriendo #sello-btn {
            transform: translate(-50%,-50%) scale(1.3) !important;
            opacity: 0 !important;
            animation: none !important;
            pointer-events: none;
        }

        /* Canvas de chispas */
        #sparks-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 30;
            pointer-events: none;
        }

        #hint-bienvenida {
            position: absolute;
            bottom: 48px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 0.9rem;
            color: rgba(180,80,90,0.8);
            letter-spacing: 3px;
            z-index: 35;
            white-space: nowrap;
            animation: hint-pulso 1.8s infinite;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        @keyframes hint-pulso {
            0%,100% { opacity: 0.4; }
            50%     { opacity: 1; }
        }
        #pantalla-bienvenida.abriendo #hint-bienvenida { opacity: 0; }

        #invitacion{
            width:100%;
            background: url('y.png') center/cover no-repeat fixed;
            background-color: #f9e8e8;
            position: relative;
            overflow: hidden;
        }

        .pagina{
            display:block;
            width:100%;
            max-width:900px;
            margin:0 auto;
            height:auto;
        }

        :root {
            --cream: #f9e8e8;
            --pink: #F4C3C3;
            --pink-dark: #e89a9a;
            --pink-light: #f8d5d5;
        }

        /* SOBRE ROSA DE REGALO - MÁS LLAMATIVO */
        .gift-section {
            background: var(--cream);
            padding: 70px 20px 50px;
            text-align: center;
            position: relative;
            border: 3px solid var(--pink);
            border-radius: 20px;
            margin: 40px auto;
            max-width: 520px;
            box-shadow: 0 20px 40px rgba(244, 195, 195, 0.4),
                        inset 0 0 60px rgba(248, 213, 213, 0.6);
            overflow: hidden;
        }

        .gift-section::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(45deg, 
                rgba(244,195,195,0.15) 0%, 
                rgba(248,213,213,0.25) 50%, 
                rgba(244,195,195,0.15) 100%);
            animation: shimmer 8s linear infinite;
            pointer-events: none;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(300%); }
        }

        #envelope-container { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }

        h2.sugerencia {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: clamp(22px, 4vw, 32px);
            color: var(--pink-dark);
            margin-bottom: 30px;
            text-shadow: 0 2px 8px rgba(244, 195, 195, 0.5);
            letter-spacing: 1px;
        }

        #envelope-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            outline: none;
        }

        .envelope-body {
            width: 160px;   /* CUADRADO */
            height: 160px;  /* CUADRADO */
            position: relative;
            filter: drop-shadow(0 15px 35px rgba(244, 195, 195, 0.7));
            transition: transform 0.4s ease;
        }

        .envelope-body:hover { 
            transform: scale(1.08) rotate(2deg); 
        }

        .ribbon-h, .ribbon-v {
            position: absolute;
            background: linear-gradient(180deg, #f8d5d5, #F4C3C3, #e89a9a);
            transition: all 0.5s ease;
            box-shadow: 0 0 12px rgba(255,255,255,0.9);
        }

        .ribbon-h {
            top: 50%;
            left: -20px;
            right: -20px;
            height: 8px;
            transform: translateY(-50%);
            z-index: 4;
        }

        .ribbon-v {
            top: -20px;
            bottom: -20px;
            left: 50%;
            width: 8px;
            transform: translateX(-50%);
            z-index: 4;
        }

        .ribbon-h.untied, .ribbon-v.untied { opacity: 0; transform: scale(0); }

        .bow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 36px;
            height: 36px;
            z-index: 5;
            transition: all 0.4s ease;
        }

        .bow::before, .bow::after {
            content: '';
            position: absolute;
            background: radial-gradient(ellipse, #ffe0e0, #F4C3C3);
            border-radius: 50%;
            width: 20px;
            height: 24px;
            top: 5px;
        }

        .bow::before { left: 0; transform: rotate(-25deg); }
        .bow::after { right: 0; transform: rotate(25deg); }

        .bow-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 12px;
            height: 12px;
            background: #ffe0e0;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(255,255,255,0.9);
        }

        .bow.untied { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }

        .envelope-flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 80px solid transparent;
            border-right: 80px solid transparent;
            border-top: 65px solid rgba(244, 195, 195, 0.85);
            z-index: 2;
            transform-origin: top center;
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .envelope-flap.open { transform: rotateX(180deg); }

        .envelope-front {
            width: 100%;
            height: 100%;
            background: rgba(244, 195, 195, 0.12);
            border: 3px solid rgba(244, 195, 195, 0.9);
            border-radius: 12px;
            position: absolute;
            backdrop-filter: blur(16px);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 30px rgba(255,255,255,0.6);
        }

        .envelope-seal { 
            font-family: 'Cinzel', serif; 
            font-size: 52px; 
            color: #fff; 
            text-shadow: 0 0 20px rgba(255,255,255,0.9), 
                         0 0 30px var(--pink-dark); 
        }

        .envelope-hint {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 21px;
            color: var(--pink-dark);
            margin-top: 15px;
            transition: opacity 0.3s;
        }

        .envelope-message {
            margin-top: 30px;
            opacity: 0;
            transform: translateY(20px);
            transition: .8s ease;
        }

        .envelope-message.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .gift-message {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(20px, 3.5vw, 28px);
            font-style: italic;
            color: #5c3a3a;

        /* Confetti / nieve de glitter en toda la página */
        #falling-glitter {
            position: fixed;
            inset: 0;
            z-index: 999;
            pointer-events: none;
            opacity: 0.75;
        }
.pagina-contenedor{

<script>
const fechaEvento = new Date("2027-03-20T18:00:00");

function actualizarContador(){

    const ahora = new Date();
    const diferencia = fechaEvento - ahora;

    const dias = Math.floor(diferencia / (1000*60*60*24));

    const horas = Math.floor(
        (diferencia % (1000*60*60*24))
        /(1000*60*60)
    );

    const minutos = Math.floor(
        (diferencia % (1000*60*60))
        /(1000*60)
    );

    const segundos = Math.floor(
        (diferencia % (1000*60))
        /1000
    );

    document.getElementById("dias").textContent = dias;
    document.getElementById("horas").textContent = horas;
    document.getElementById("minutos").textContent = minutos;
    document.getElementById("segundos").textContent = segundos;
}

actualizarContador();
setInterval(actualizarContador,1000);

(function(){

    // === GLITTER EXISTENTE (pantalla bienvenida) ===
    const gc = document.getElementById('glitter-canvas');
    const gx = gc.getContext('2d');
    let stars = [];

    function resizeGlitter() {
        gc.width = window.innerWidth;
        gc.height = window.innerHeight;
        buildStars();
    }

    function buildStars() {
        stars = [];
        const count = Math.max(45, Math.floor((gc.width * gc.height) / 13500));
        for (let i = 0; i < count; i++) stars.push(newStar(true));
    }

    function newStar(randomPhase) {
        const big = Math.random() < 0.22;
        return {
            x: Math.random() * gc.width,
            y: Math.random() * gc.height,
            size: big ? Math.random() * 10 + 6 : Math.random() * 4.5 + 1.8,
            phase: randomPhase ? Math.random() * Math.PI * 2 : 0,
            speed: Math.random() * 0.028 + 0.011,
            alpha: 0,
            white: Math.random() < 0.78,
            big
        };
    }

    function drawDiamond(ctx, x, y, size, alpha, white) {
        const color = white ? `rgba(255,255,255,${alpha})` : `rgba(255,210,220,${alpha})`;
        const colorG = white ? `rgba(255,255,255,${alpha*0.35})` : `rgba(255,190,210,${alpha*0.35})`;

        ctx.save();
        ctx.translate(x, y);

        const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, size * 2.2);
        grad.addColorStop(0, white ? `rgba(255,255,255,${alpha*0.6})` : `rgba(255,200,215,${alpha*0.6})`);
        grad.addColorStop(0.4, colorG);
        grad.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(0, 0, size * 2.2, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = color;
        ctx.lineCap = 'round';
        ctx.lineWidth = size * 0.13;
        ctx.beginPath(); ctx.moveTo(0, -size*1.9); ctx.lineTo(0, size*1.9); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-size*1.9, 0); ctx.lineTo(size*1.9, 0); ctx.stroke();

        ctx.lineWidth = size * 0.07;
        const d = size * 0.85;
        ctx.beginPath(); ctx.moveTo(-d, -d); ctx.lineTo(d, d); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(d, -d); ctx.lineTo(-d, d); ctx.stroke();

        ctx.fillStyle = white ? `rgba(255,255,255,${alpha})` : `rgba(255,230,235,${alpha})`;
        ctx.beginPath(); ctx.arc(0, 0, size * 0.2, 0, Math.PI * 2); ctx.fill();

        ctx.restore();
    }

    function animateGlitter() {
        if (document.getElementById('pantalla-bienvenida') && 
            !document.getElementById('pantalla-bienvenida').classList.contains('oculto')) {
            gx.clearRect(0, 0, gc.width, gc.height);
            stars.forEach((s, i) => {
                s.phase += s.speed;
                const t = (Math.sin(s.phase) + 1) / 2;
                s.alpha = Math.pow(t, 1.85);
                if (s.alpha > 0.015) drawDiamond(gx, s.x, s.y, s.size, s.alpha * (s.big ? 0.92 : 0.72), s.white);
                if (s.phase > Math.PI * 2) {
                    stars[i] = newStar(false);
                    stars[i].x = Math.random() * gc.width;
                    stars[i].y = Math.random() * gc.height;
                }
            });
        }
        requestAnimationFrame(animateGlitter);
    }

    resizeGlitter();
    animateGlitter();
    window.addEventListener('resize', resizeGlitter);

    // === CHISPAS DRAMÁTICAS ===
    const sc = document.getElementById('sparks-canvas');
    const sx = sc.getContext('2d');
    let sparks = [];
    let sparksRunning = false;

    function resizeSparks() {
        sc.width = window.innerWidth;
        sc.height = window.innerHeight;
    }
    resizeSparks();
    window.addEventListener('resize', resizeSparks);

    function burst(cx, cy, count) {
        for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 9 + 1.5;
            const type = Math.random();
            const hue = Math.random() < 0.6 ? null : Math.floor(Math.random()*40 + 320);

            sparks.push({
                x: cx, y: cy,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed - (Math.random() * 3),
                r: type < 0.5 ? Math.random() * 1.5 + 0.5 : type < 0.8 ? Math.random() * 3.5 + 1.5 : Math.random() * 5 + 3,
                alpha: 1,
                decay: Math.random() * 0.018 + 0.012,
                gravity: 0.08 + Math.random() * 0.07,
                type: type < 0.5 ? 'line' : type < 0.8 ? 'star' : 'orb',
                hue
            });
        }
        if (!sparksRunning) { sparksRunning = true; animateSparks(); }
    }

    function drawStar4(ctx, x, y, size, alpha, hue) {
        const color = hue ? `hsla(${hue},75%,88%,${alpha})` : `rgba(255,255,255,${alpha})`;
        ctx.save();
        ctx.translate(x, y);
        ctx.strokeStyle = color;
        ctx.lineCap = 'round';
        ctx.lineWidth = size * 0.18;
        ctx.beginPath(); ctx.moveTo(0, -size); ctx.lineTo(0, size); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-size, 0); ctx.lineTo(size, 0); ctx.stroke();
        const d = size * 0.45;
        ctx.lineWidth = size * 0.1;
        ctx.beginPath(); ctx.moveTo(-d, -d); ctx.lineTo(d, d); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(d, -d); ctx.lineTo(-d, d); ctx.stroke();
        ctx.fillStyle = color; ctx.beginPath(); ctx.arc(0, 0, size*0.14, 0, Math.PI*2); ctx.fill();
        ctx.restore();
    }

    function animateSparks() {
        sx.clearRect(0, 0, sc.width, sc.height);
        sparks = sparks.filter(s => s.alpha > 0.008);
        sparks.forEach(s => {
            const color = s.hue ? `hsla(${s.hue},75%,85%,${s.alpha})` : `rgba(255,255,255,${s.alpha})`;
            if (s.type === 'line') {
                sx.save();
                sx.strokeStyle = color; sx.lineWidth = s.r; sx.lineCap = 'round';
                sx.beginPath(); sx.moveTo(s.x - s.vx*3, s.y - s.vy*3); sx.lineTo(s.x, s.y); sx.stroke();
                sx.restore();
            } else if (s.type === 'star') {
                drawStar4(sx, s.x, s.y, s.r*1.4, s.alpha, s.hue);
            } else {
                sx.save();
                const grad = sx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r*2.5);
                grad.addColorStop(0, s.hue ? `hsla(${s.hue},80%,95%,${s.alpha})` : `rgba(255,255,255,${s.alpha})`);
                grad.addColorStop(1, 'rgba(255,255,255,0)');
                sx.fillStyle = grad;
                sx.beginPath(); sx.arc(s.x, s.y, s.r*2.5, 0, Math.PI*2); sx.fill();
                sx.restore();
            }
            s.x += s.vx; s.y += s.vy; s.vy += s.gravity; s.vx *= 0.97; s.alpha -= s.decay;
        });
        if (sparks.length > 0) requestAnimationFrame(animateSparks);
        else sparksRunning = false;
    }

    // Hover y touch
    const sello = document.getElementById('sello-btn');
    let hoverInt = null;
    sello.addEventListener('mouseenter', () => {
        hoverInt = setInterval(() => {
            const r = sello.getBoundingClientRect();
            burst(r.left + r.width/2, r.top + r.height/2, 8);
        }, 120);
    });
    sello.addEventListener('mouseleave', () => clearInterval(hoverInt));
    sello.addEventListener('touchstart', e => {
        const t = e.touches[0];
        burst(t.clientX, t.clientY, 200);
    }, { passive: true });

    // === ABRIR SOBRE (CORREGIDO) ===
    window.abrirSobre = function() {
        const musica = document.getElementById("musica");
        if (musica) musica.play().catch(() => {});

        const pantalla = document.getElementById('pantalla-bienvenida');
        if (!pantalla || pantalla.classList.contains('abriendo')) return;

        pantalla.classList.add('abriendo');

        const selloEl = document.getElementById('sello-btn');
        if (selloEl) {
            const r = selloEl.getBoundingClientRect();
            burst(r.left + r.width / 2, r.top + r.height / 2, 220);
        }

        setTimeout(() => pantalla.classList.add('oculto'), 1600);
    };

    // === BRILLITOS DESTELLANTES EN LA PÁGINA PRINCIPAL ===
    const fg = document.getElementById('falling-glitter');
    const fx = fg.getContext('2d');
    let fallingStars = [];

    function resizeFalling() {
        fg.width = window.innerWidth;
        fg.height = window.innerHeight;
    }
    resizeFalling();
    window.addEventListener('resize', resizeFalling);

    function createFallingStar() {
        return {
            x: Math.random() * fg.width,
            y: Math.random() * fg.height - 100,
            size: Math.random() * 5.5 + 2.2,
            speed: Math.random() * 1.1 + 0.55,
            sway: Math.random() * 1.8 + 0.8,
            phase: Math.random() * Math.PI * 2,
            opacity: Math.random() * 0.65 + 0.45,
            white: Math.random() < 0.78
        };
    }

    function buildFallingStars() {
        fallingStars = [];
        const count = Math.max(32, Math.floor((fg.width * fg.height) / 22000));
        for (let i = 0; i < count; i++) fallingStars.push(createFallingStar());
    }

    function animateFalling() {
        fx.clearRect(0, 0, fg.width, fg.height);
        fallingStars.forEach(f => {
            f.y += f.speed;
            f.x += Math.sin(f.phase) * f.sway * 0.04;
            f.phase += 0.035;
            if (f.y > fg.height + 30) f.y = -30;

            const alpha = f.opacity * (0.6 + 0.4 * Math.sin(f.phase * 3));
            drawDiamond(fx, f.x, f.y, f.size, alpha, f.white);
        });
        requestAnimationFrame(animateFalling);
    }

    buildFallingStars();
    animateFalling();

    // === ABRIR SOBRE REGALO ===
    let envelopeOpened = false;
    window.openEnvelope = function() {
        if (envelopeOpened) return;
        envelopeOpened = true;

        const btn = document.getElementById('envelope-btn');
        const flap = document.getElementById('env-flap');
        const ribbonH = document.getElementById('ribbon-h');
        const ribbonV = document.getElementById('ribbon-v');
        const bow = document.getElementById('bow');
        const hint = document.getElementById('env-hint');
        const message = document.getElementById('envelope-message');

        ribbonH.classList.add('untied');
        ribbonV.classList.add('untied');
        bow.classList.add('untied');
        if (hint) hint.style.opacity = '0';

        const r = btn.getBoundingClientRect();
        const cx = r.left + r.width / 2;
        const cy = r.top + r.height / 2;
        burst(cx, cy, 90);

        setTimeout(() => flap.classList.add('open'), 500);

        setTimeout(() => {
            message.style.display = 'block';
            setTimeout(() => message.classList.add('visible'), 50);
            burst(cx, cy, 70);
        }, 1300);
    };

})();
</script>
</body>
</html>
